# Собирает аддон и выкладывает релиз.
# Запуск: пуш тега вида v1.2.3; вручную (Run workflow) — тег vВЕРСИЯ.ГГГГММДД
# ставится здесь же, потому что облачные сессии Claude ставить теги не могут;
# коммит в main с новым чартом, каталогом или «где найти» запускает ручной выпуск.
# CurseForge и Wago подключаются секретами CF_API_KEY и WAGO_API_TOKEN
# и строками X-Curse-Project-ID / X-Wago-ID в TransmogHub.toc.
name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - Data/Charts.lua
      - Data/Bundled.lua
      - Data/Sources.lua
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Пуш в main (чарт, каталог, «где найти»): сборщик на пуше в ветку коммит с тегом
      # не собирает («future tag»), поэтому выпуск передаётся ручному запуску.
      # Тег, пушнутый с GITHUB_TOKEN, не запускает этот workflow второй раз.
      - name: Tag
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            gh workflow run release.yml --ref main
            echo "Выпуск передан ручному запуску"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          TAG="v$(tr -d ' \n' < VERSION).$(date -u +%Y%m%d)"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Тег $TAG уже есть, сегодня уже выпускали"
              echo "SKIP=1" >> "$GITHUB_ENV"
              exit 0
            fi
            # тег без выпуска (сборка не дошла до конца) — ставим заново на текущий коммит
            echo "Тег $TAG без выпуска — переставляем"
            git push origin ":refs/tags/$TAG"
            git tag -d "$TAG" 2>/dev/null || true
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "Тег $TAG"

      - uses: BigWigsMods/packager@v2
        if: env.SKIP != '1'

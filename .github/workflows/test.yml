# Проверка синтаксиса и тест в заглушке игрового API на каждый пуш.
name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Syntax check
        run: luac5.1 -p *.lua Data/*.lua

      - name: Smoke test
        run: lua5.1 tests/smoke.lua .

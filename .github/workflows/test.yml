# Проверка синтаксиса и тест в заглушке игрового API на каждый пуш.
name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Syntax check
        run: luac5.1 -p *.lua Data/*.lua Locales/*.lua TransmogHub_Sources/*.lua

      - name: Smoke test
        run: lua5.1 tests/smoke.lua .

      - name: Name filter test
        run: lua5.1 tests/filter.lua .

      - name: Translations
        run: lua5.1 tests/locales.lua .

      - name: Official chart test
        run: lua5.1 tests/charts.lua .

      - name: Built-in item sources (AllTheThings extract)
        run: lua5.1 tests/att.lua .

      - name: Letter encryption (Lua encrypts, Python decrypts)
        run: lua5.1 tests/crypto.lua .

      # База на пределе хранения: пересчёты после сообщений сети не должны тормозить игру
      - name: Performance check
        run: lua5.1 tools/bench/bench.lua . 3000 100000 5000 --check
